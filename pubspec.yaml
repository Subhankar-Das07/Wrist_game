name: jesture
description: A real-time computer vision motion tracking game using YOLOv8-Pose and Flame.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  camera: ^0.12.0+1
  flame: ^1.37.0
  flutter:
    sdk: flutter
  google_mlkit_pose_detection: ^0.15.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
