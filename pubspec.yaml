name: jesture
description: Jesture — A real-time computer vision hand-tracking game. Punch balls and hit stars using your actual fists tracked by AI. No controller needed.
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  camera: ^0.12.0+1
  flame: ^1.37.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  permission_handler: ^11.3.0
  app_settings: ^8.0.0
  audioplayers: ^6.1.0
  razorpay_flutter: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
